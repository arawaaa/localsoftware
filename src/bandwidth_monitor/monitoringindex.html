<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLAN Traffic Monitor</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f4f9; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        #status { text-align: center; margin-bottom: 10px; color: #666; font-size: 0.9em; }
        .chart-container { position: relative; height: 300px; width: 100%; border: 1px solid #ddd; margin-bottom: 20px; }
        canvas { display: block; width: 100%; height: 100%; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9em; }
        th, td { padding: 10px; border: 1px solid #eee; text-align: left; }
        th { background: #f8f8f8; color: #555; }
        tr:nth-child(even) { background: #fafafa; }
        .summary-row { font-weight: bold; background: #eefbff !important; }
        .type-tag { font-size: 0.8em; padding: 2px 6px; border-radius: 4px; background: #ddd; color: #666; }
        .type-daily { background: #cce5ff; color: #004085; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/luxon/3.0.1/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.2.0/dist/chartjs-adapter-luxon.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Raspberry Pi WLAN Traffic</h1>
        <div id="status">Connecting...</div>
        
        <div class="chart-container">
            <canvas id="trafficChart"></canvas>
        </div>

        <h3>Usage History</h3>
        <table id="historyTable">
            <thead>
                <tr>
                    <th>Time / Date</th>
                    <th>Type</th>
                    <th>Sent (TX)</th>
                    <th>Received (RX)</th>
                </tr>
            </thead>
            <tbody>
                <!-- History rows will be added here -->
            </tbody>
        </table>
    </div>

    <script>
        const ctx = document.getElementById('trafficChart').getContext('2d');
        const statusDiv = document.getElementById('status');
        const historyBody = document.querySelector('#historyTable tbody');
        
        function formatBytes(bytes, isSpeed = false) {
            if (bytes === 0) return '0 B' + (isSpeed ? '/s' : '');
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            const val = parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            return isSpeed ? val + '/s' : val;
        }

        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [
                    {
                        label: 'TX (Upload)',
                        borderColor: 'rgb(255, 99, 132)',
                        backgroundColor: 'rgba(255, 99, 132, 0.5)',
                        data: [],
                        yAxisID: 'y',
                        tension: 0.1,
                        pointRadius: 0
                    },
                    {
                        label: 'RX (Download)',
                        borderColor: 'rgb(53, 162, 235)',
                        backgroundColor: 'rgba(53, 162, 235, 0.5)',
                        data: [],
                        yAxisID: 'y',
                        tension: 0.1,
                        pointRadius: 0
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                interaction: { mode: 'index', intersect: false },
                scales: {
                    x: {
                        type: 'time',
                        time: { unit: 'second', displayFormats: { second: 'HH:mm:ss' } },
                        title: { display: true, text: 'Time' }
                    },
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        title: { display: true, text: 'Live Speed' },
                        beginAtZero: true,
                        ticks: { callback: (v) => formatBytes(v, true) }
                    }
                }
            }
        });

        let isLive = false;
        // Use window.location.host to automatically get hostname:port
        const host = window.location.host || 'rapi.local:8443';
        const wsUrl = `wss://${host}`;
        let ws;

        console.log("Connecting to WebSocket:", wsUrl);

        function addHistoryRow(ts, tx, rx, hour) {
            const row = document.createElement('tr');
            const date = new Date(ts);
            const isDaily = (hour === 24);
            
            if (isDaily) row.className = 'summary-row';
            
            const timeStr = isDaily ? date.toLocaleDateString() : date.toLocaleString();
            const typeStr = isDaily ? '<span class="type-tag type-daily">DAILY</span>' : `<span class="type-tag">HOUR ${hour}</span>`;
            
            row.innerHTML = `
                <td>${timeStr}</td>
                <td>${typeStr}</td>
                <td>${formatBytes(tx)}</td>
                <td>${formatBytes(rx)}</td>
            `;
            
            // Prepend so newest is on top
            if (historyBody.firstChild) {
                historyBody.insertBefore(row, historyBody.firstChild);
            } else {
                historyBody.appendChild(row);
            }
        }

        function connect() {
            ws = new WebSocket(wsUrl);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                statusDiv.textContent = 'Connected. Syncing history...';
                statusDiv.style.color = 'blue';
                historyBody.innerHTML = ''; // Clear table on reconnect
            };

            ws.onmessage = (event) => {
                if (event.data instanceof ArrayBuffer) {
                    const view = new DataView(event.data);
                    
                    if (!isLive) {
                        // Check for Marker: 3x UINT64_MAX (24 bytes)
                        if (view.byteLength === 24) {
                            const v1 = view.getBigUint64(0, true);
                            if (v1 === 0xFFFFFFFFFFFFFFFFn) {
                                isLive = true;
                                statusDiv.textContent = 'Live Streaming';
                                statusDiv.style.color = 'green';
                                return;
                            }
                        }
                        
                        // History Records: Multiple of 28 bytes (TS:8, TX:8, RX:8, HOUR:4)
                        if (view.byteLength % 28 === 0) {
                            for (let offset = 0; offset < view.byteLength; offset += 28) {
                                const ts = Number(view.getBigUint64(offset, true)) * 1000;
                                const tx = Number(view.getBigUint64(offset + 8, true));
                                const rx = Number(view.getBigUint64(offset + 16, true));
                                const hour = view.getUint32(offset + 24, true);
                                addHistoryRow(ts, tx, rx, hour);
                            }
                        }
                    } else {
                        // Live Update: LogRecord format (28 bytes)
                        if (view.byteLength === 28) {
                            const ts = Number(view.getBigUint64(0, true)) * 1000;
                            const tx = Number(view.getBigUint64(8, true));
                            const rx = Number(view.getBigUint64(16, true));
                            
                            chart.data.datasets[1].data.push({x: ts, y: rx});
                            chart.data.datasets[0].data.push({x: ts, y: tx});
                            
                            const cutoff = ts - 60000;
                            while (chart.data.datasets[0].data.length > 0 && chart.data.datasets[0].data[0].x < cutoff) {
                                chart.data.datasets[0].data.shift();
                                chart.data.datasets[1].data.shift();
                            }
                            chart.update('none');
                        }
                    }
                }
            };

            ws.onclose = () => {
                statusDiv.textContent = 'Disconnected. Retrying...';
                statusDiv.style.color = 'red';
                isLive = false;
                setTimeout(connect, 2000);
            };
        }

        connect();
    </script>
</body>
</html>
