<!DOCTYPE HTML>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw Reverse Proxy Authentication</title>
    <style>
        body { font-family: 'sans-serif'; }
        #header { max-width: 1000px; margin: 0 auto; }
    </style>
    <script>
        function addListener() {
            document.getElementById("auth").onclick = async function() {
                const response = await fetch('/login', {
                    method: 'POST',
                    body: document.getElementById("password").value
                })

                if (!response.ok) {
                    const message = `Failed to authenticate`;
                    throw new Error(message);
                }

                const redirect = await response.text()

                window.location.href = redirect
                window.location.reload()
            }
        }
        document.addEventListener("DOMContentLoaded", (event) => {
            addListener()
        });

        console.log("run")
    </script>
</head>
<body>
    <div id="header">
        <h1>OpenClaw Login</h1>
        <p>Reverse proxied to internal instance</p>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required />
        <button id="auth">Authenticate</button>
        <br>
        <p>Powered by my handcrafted asynchronous IO server. All services on this domain are served by the same process.</p>
        <a href="www.github.com/arawaaa/localsoftware">Github</a>
    </div>
</html>
