<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lennox S40 Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; min-width: 300px; }
        h1 { color: #1a73e8; margin-bottom: 1.5rem; }
        .metric { margin: 1rem 0; font-size: 1.2rem; color: #3c4043; }
        .value { font-weight: bold; font-size: 2rem; color: #202124; }
        .unit { font-size: 1rem; color: #70757a; margin-left: 0.2rem; }
        #status { font-size: 0.8rem; color: #9aa0a6; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Home Climate</h1>
        <div class="metric">
            Temperature: <span id="temp" class="value">--</span><span class="unit">°F</span>
        </div>
        <div class="metric">
            Humidity: <span id="hum" class="value">--</span><span class="unit">%</span>
        </div>
        <div id="status">Last updated: Never</div>
    </div>

    <script>
        async function updateMetrics() {
            try {
                const [tempRes, humRes] = await Promise.all([
                    fetch('/temperature'),
                    fetch('/humidity')
                ]);
                
                const temp = await tempRes.text();
                const hum = await humRes.text();
                
                document.getElementById('temp').textContent = temp;
                document.getElementById('hum').textContent = hum;
                document.getElementById('status').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
            } catch (e) {
                console.error("Failed to fetch metrics", e);
            }
        }

        // Initial update
        updateMetrics();
        // Update every 30 seconds (given the serial nature of the server)
        setInterval(updateMetrics, 30000);
    </script>
</body>
</html>
